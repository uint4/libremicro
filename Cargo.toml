[package]
name = "libremicro"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Direct, typed access to the stock Codex Micro HID interface"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/libremicro"
homepage = "https://github.com/uint4/libremicro"
repository = "https://github.com/uint4/libremicro"
keywords = ["codex-micro", "hid", "hidraw", "macropad"]
categories = ["api-bindings", "hardware-support"]
exclude = [".github/**", ".agents/*"]
resolver = "3"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []
live-hardware-tests = []
persistent-writes = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["event", "fs", "std"] }

[dev-dependencies]
proptest = "1.7"

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
